server.port=${SERVER_PORT:8081}
spring.application.name=${APP_NAME:insurance-agent}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insurance}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:rootroot}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USER:vskabi123@gmail.com}
spring.mail.password=${GMAIL_APP_PASS:00000000@0}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-12345}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.whatsapp.api-url=${WA_API_URL:https://graph.facebook.com/v18.0}
app.whatsapp.token=${WA_TOKEN:}
app.whatsapp.phone-number-id=${WA_PHONE_ID:}
app.scheduler.expiry-cron=${EXPIRY_CRON:0 0 9 * * *}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
cloudinary.cloud-name=${CLOUD_NAME:}
cloudinary.api-key=${CLOUD_KEY:}
cloudinary.api-secret=${CLOUD_SECRET:}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
springdoc.api-docs.path=${OPENAPI_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_PATH:/swagger-ui.html}
management.endpoints.web.exposure.include=health,info
