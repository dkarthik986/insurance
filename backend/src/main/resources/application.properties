spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${SERVER_PORT:8023}
spring.application.name=${APP_NAME:insurance-agent}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.mail.host=${GMAIL_HOST:smtp.gmail.com}
spring.mail.port=${GMAIL_PORT:587}
spring.mail.username=${GMAIL_USER:}
spring.mail.password=${GMAIL_APP_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:900000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:4000}
app.auth.refresh-cookie-name=${REFRESH_COOKIE_NAME:INSUREDESK_REFRESH}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie-path=${AUTH_COOKIE_PATH:/api/v1/auth}
app.auth.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.auth.lock-minutes=${LOCK_MINUTES:15}
app.frontend.reset-url=${FRONTEND_RESET_URL:http://localhost:4000/reset-password}
app.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.name=${BOOTSTRAP_ADMIN_NAME:Development Dealer}
app.whatsapp.api-url=${WA_API_URL:https://graph.facebook.com/v18.0}
app.whatsapp.token=${WA_TOKEN:}
app.whatsapp.phone-number-id=${WA_PHONE_ID:}
app.scheduler.expiry-cron=${EXPIRY_CRON:0 0 9 * * *}
app.time-zone=${APP_TIME_ZONE:Asia/Kolkata}
cloudinary.cloud-name=${CLOUD_NAME:}
cloudinary.api-key=${CLOUD_KEY:}
cloudinary.api-secret=${CLOUD_SECRET:}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}
springdoc.api-docs.path=${OPENAPI_PATH:/api-docs}
springdoc.swagger-ui.path=${SWAGGER_PATH:/swagger-ui.html}
management.endpoints.web.exposure.include=health,info
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
